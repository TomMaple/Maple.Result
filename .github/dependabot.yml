# Dependabot configuration for automated dependency updates.
# For more information, see: https://docs.github.com/en/code-security/dependabot
#
# Titles start with "chore(deps)" so they pass the PR title check and stay out of the release notes.
# The 7-day cooldown skips releases younger than a week; it does not delay security updates.
# NuGet minor and patch updates are grouped (and merged automatically, see dependabot-auto-merge.yml);
# majors arrive as separate pull requests. The compiler packages of the analyzers are ignored (see below).

version: 2
updates:
  # NuGet packages across src/ and tests/ project files.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    # The compiler packages (#331). The analyzers and the code fixes are built against the compiler of the oldest SDK that has
    # to load them, Roslyn 5.0 (#304): a newer version makes that compiler skip them (CS9057), and every build and test would
    # still pass. The version changes by hand, with the oldest supported compiler in docs/Analyzers/README.md; a test of each
    # analyzer test project fails when it is raised. The test projects compile their snippets with these packages too (the
    # default of TestRoslynVersion, Directory.Build.props), and follow newer compilers in CI through TEST_ROSLYN_VERSION (#330).
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
